# Nginx configuration for Flowr P2P Node Load Balancer
# Location: /etc/nginx/sites-available/flowr-p2p (Linux/Mac)
# Or: C:\nginx-*\conf\nginx.conf (Windows)

upstream flowr_nodes {
    # Node 1 - Port 5000
    server 127.0.0.1:5000;
    
    # Node 2 - Port 5001
    server 127.0.0.1:5001;
    
    # Node 3 - Port 5002
    server 127.0.0.1:5002;
    
    # Add more nodes as needed
    # server 127.0.0.1:5003;
}

# HTTP Server - Redirect to HTTPS (optional)
server {
    listen 80;
    server_name localhost;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server (optional - uncomment if using SSL)
# server {
#     listen 443 ssl;
#     server_name localhost;
#     
#     ssl_certificate /path/to/cert.pem;
#     ssl_certificate_key /path/to/key.pem;


# Main Proxy Server
server {
    listen 8080;
    server_name localhost;

    # Proxy to Flowr P2P Nodes
    location / {
        proxy_pass http://flowr_nodes;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health Check Endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx Status Page
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
