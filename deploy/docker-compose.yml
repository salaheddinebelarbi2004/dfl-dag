version: "3.9"

networks:
  p2p-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  client-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: client-0
    hostname: client-0
    environment:
      CLIENT_ID: "0"
      NUM_CLIENTS: "12"
      NUM_SHARDS: "3"
      NUM_ROUNDS: "5"
      LOCAL_EPOCHS: "2"
      P2P_PORT: "5555"
      BATCH_SIZE: "32"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../real_federated_data/client_0.npz:/data/real_federated_data/client_0.npz:ro
      - ../results:/results
    networks:
      p2p-net:
        ipv4_address: 172.28.0.10
    restart: "no"
    depends_on: []

